<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORJA">
  <meta name="description" content="FORJA — treinos, cargas e evolução.">
  <title>FORJA</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <!-- Instalar como app (tela inicial, tela cheia) -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Aplica tema e preferência de movimento antes da primeira pintura (evita flash) -->
  <script>
    (function () {
      try {
        // Preferências da conta logada (forja.u.<id>.settings); antes do login, as antigas
        var sess = JSON.parse(localStorage.getItem('forja.session') || 'null');
        var key = sess && sess.user ? 'forja.u.' + sess.user.id + '.settings' : 'forja.settings';
        var s = JSON.parse(localStorage.getItem(key) || '{}');
        if (sess && sess.user && sess.user.plan === 'premium') document.documentElement.classList.add('is-premium');
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (s.animations === false) document.documentElement.classList.add('no-motion');
      } catch (e) {}
    })();
  </script>

  <!-- ?v=... força o navegador a baixar a versão nova depois de cada atualização. Mude o número ao publicar. -->
  <link rel="stylesheet" href="css/style.css?v=20260924d">
  <!-- Reset + utilitários (antes vinham do Tailwind via CDN). Fica depois de style.css de propósito. -->
  <link rel="stylesheet" href="css/base.css?v=20260924d">
</head>
<body>
  <div id="app" class="app" hidden>
    <header id="topbar" class="topbar" aria-hidden="true">
      <span id="topbar-title" class="topbar-title"></span>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" aria-label="Navegação principal"></nav>
  </div>

  <!-- Treino em andamento, minimizado -->
  <button id="active-bar" class="active-bar" type="button" hidden aria-label="Voltar ao treino em andamento"></button>

  <!-- Modo treino (tela cheia, sem barra de navegação) -->
  <div id="training" class="training" hidden role="dialog" aria-modal="true" aria-label="Modo treino"></div>

  <div id="onboarding" class="onboarding" hidden></div>

  <!-- Entrar / criar conta / confirmar e-mail / nova senha / escolher plano -->
  <div id="auth" class="onboarding auth" hidden></div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script src="js/config.js?v=20260924d"></script>
  <script src="js/utils.js?v=20260924d"></script>
  <script src="js/storage.js?v=20260924d"></script>
  <script src="js/backend.js?v=20260924d"></script>
  <script src="js/statistics.js?v=20260924d"></script>
  <script src="js/exercises.js?v=20260924d"></script>
  <script src="js/workouts.js?v=20260924d"></script>
  <script src="js/sessions.js?v=20260924d"></script>
  <script src="js/programs.js?v=20260924d"></script>
  <script src="js/balance.js?v=20260924d"></script>
  <script src="js/reminders.js?v=20260924d"></script>
  <script src="js/progress.js?v=20260924d"></script>
  <script src="js/share.js?v=20260924d"></script>
  <script src="js/plans.js?v=20260924d"></script>
  <script src="js/pwa.js?v=20260924d"></script>
  <script src="js/auth.js?v=20260924d"></script>
  <script src="js/app.js?v=20260924d"></script>
</body>
</html>
